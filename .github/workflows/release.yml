name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path target/release/krop.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  krop.exe" | Out-File -FilePath target/release/krop.exe.sha256 -Encoding ascii -NoNewline

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} `
            target/release/krop.exe `
            target/release/krop.exe.sha256 `
            --verify-tag `
            --generate-notes
